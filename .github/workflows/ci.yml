name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    # Pinned because the code falls back to differing defaults -- some
    # modules assume /api, others /api/v1. P4 unifies them.
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking: this repo type-checks clean today.
      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
